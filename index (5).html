<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0a1f" id="metaTheme">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<title>Octofy</title>
<style>
:root{
  --bg:#0d0a1f; --panel:#14102b; --panel2:#1d1740; --field:#221a4d; --line:#2a2257;
  --text:#f3efff; --muted:#9a8fc8; --accent:#8b5cf6; --accent2:#a78bfa; --mine:#7c3aed;
  --theirs:#241b4d; --danger:#f87171; --badge:#33265f; --ok:#34d399; --fs:16px;
}
:root[data-theme=light]{
  --bg:#f6f4ff; --panel:#ffffff; --panel2:#efeaff; --field:#ebe5ff; --line:#ddd5f5;
  --text:#1b1535; --muted:#6b6296; --theirs:#ebe6fb; --badge:#e3d9ff; --danger:#dc2626;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:var(--fs);line-height:1.4}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;display:block}
.hidden{display:none!important}

/* ---------- auth / cards ---------- */
#auth{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px;
  background:radial-gradient(900px 500px at 50% -10%,color-mix(in srgb,var(--accent) 35%,transparent),transparent),var(--bg)}
.card{width:100%;max-width:400px;background:var(--panel);border:1px solid var(--line);border-radius:26px;padding:26px}
.logo{display:flex;align-items:center;gap:12px}
.mark{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,var(--accent2),var(--mine));display:grid;place-items:center;color:#fff;flex:none}
.mark svg{width:24px;height:24px}
.logo h1{font-size:1.9em;letter-spacing:.3px}
.sub{color:var(--muted);margin:8px 0 20px;font-size:.9em}
.field{width:100%;background:var(--field);border:1px solid transparent;border-radius:16px;padding:13px 16px;margin-bottom:10px;outline:none}
.field:focus{border-color:var(--accent)}
.field::placeholder{color:var(--muted)}
textarea.field{resize:vertical;min-height:70px}
.btn{width:100%;background:linear-gradient(135deg,var(--accent),var(--mine));color:#fff;border-radius:16px;padding:13px;font-weight:600}
.btn:disabled{opacity:.5}
.btn.ghost{background:var(--field);color:var(--text);margin-top:10px}
.btn.danger{background:color-mix(in srgb,var(--danger) 16%,var(--panel));color:var(--danger);margin-top:10px}
.link{color:var(--accent2);font-size:.9em;margin-top:14px;display:block;text-align:center;width:100%}
.err{color:var(--danger);font-size:.82em;min-height:18px;margin-bottom:8px}
.ok{color:var(--ok)}

/* ---------- shell ---------- */
#app{height:100vh;height:100dvh;display:flex}
#side{width:390px;max-width:100%;background:var(--bg);border-right:1px solid var(--line);display:flex;flex-direction:column;height:100%;flex:none}
.top{display:flex;align-items:center;justify-content:space-between;padding:calc(12px + env(safe-area-inset-top)) 16px 4px}
.top .logo h1{font-size:1.7em}
.ib{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;color:var(--text);flex:none;position:relative}
.ib:hover,.ib:active{background:var(--panel2)}
.ib.on{color:var(--accent2)}
.views{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;display:flex;flex-direction:column;padding:0 16px}
.view h2{font-size:1.9em;margin:8px 0 12px}
.sbox{position:relative;margin-bottom:10px}
.sbox svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--muted);width:20px;height:20px}
.sbox .field{padding-left:46px;margin:0;border-radius:20px;background:var(--panel2)}
.chips{display:flex;gap:8px;margin-bottom:6px;overflow-x:auto;flex:none;scrollbar-width:none}
.chp{padding:8px 15px;border-radius:99px;background:var(--panel2);color:var(--text);font-size:.88em;flex:none;white-space:nowrap}
.chp.on{background:color-mix(in srgb,var(--accent) 26%,var(--panel));color:var(--accent2)}
.scroll{flex:1;overflow-y:auto;margin:0 -16px;padding-bottom:10px}
.pad{padding:0 16px}
.row{display:flex;gap:13px;padding:11px 16px;align-items:center;cursor:pointer}
.row:hover,.row.act{background:var(--panel)}
.av{width:54px;height:54px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;color:#fff;font-size:1.35em;overflow:hidden;position:relative}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.av.s{width:40px;height:40px;font-size:1.05em}
.av.xl{width:96px;height:96px;font-size:2.4em;margin:6px auto 14px}
.av .dot{position:absolute;right:1px;bottom:1px;width:13px;height:13px;border-radius:50%;background:var(--ok);border:2px solid var(--bg)}
.row .meta{flex:1;min-width:0}
.row .nm{font-weight:700;font-size:1.05em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;gap:6px;align-items:center}
.row .nm svg{width:14px;height:14px;color:var(--muted);flex:none}
.row .pv{color:var(--muted);font-size:.92em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.row .pv.un{color:var(--text)}
.row .side{display:flex;flex-direction:column;align-items:flex-end;gap:7px;flex:none;min-width:44px}
.row .tm{color:var(--muted);font-size:.85em}
.badge{min-width:23px;height:23px;padding:0 7px;border-radius:99px;background:var(--accent);color:#fff;font-size:.78em;font-weight:600;display:grid;place-items:center}
.badge.mute{background:var(--badge);color:var(--accent2)}
.sec{color:var(--muted);font-size:.8em;text-transform:uppercase;letter-spacing:.06em;padding:12px 16px 4px}
.empty{color:var(--muted);text-align:center;padding:44px 24px;font-size:.9em;line-height:1.55}
.nav{display:flex;justify-content:space-around;border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));background:var(--bg)}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:.75em;padding:6px 14px;border-radius:14px}
.nav button.on{color:var(--accent2)}

/* profile / settings */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:12px}
.lbl{color:var(--muted);font-size:.82em;margin-bottom:6px}
.tg{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0}
.tg + .tg{border-top:1px solid var(--line)}
.sw{width:48px;height:28px;border-radius:99px;background:var(--field);position:relative;transition:.2s;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--accent)}
.sw.on::after{left:23px}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.dotc{width:34px;height:34px;border-radius:50%;border:3px solid transparent}
.dotc.on{border-color:var(--text)}

/* ---------- chat ---------- */
#main{flex:1;display:flex;flex-direction:column;height:100%;min-width:0;position:relative;
  background:radial-gradient(700px 400px at 80% 0,color-mix(in srgb,var(--accent) 14%,transparent),transparent),var(--bg)}
#placeholder{flex:1;display:grid;place-items:center;color:var(--muted);text-align:center;padding:24px;line-height:1.6}
#chatView{flex-direction:column;flex:1;min-height:0;position:relative}
#chatHead{display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top)) 8px 8px;background:var(--panel);border-bottom:1px solid var(--line)}
#chatHead .t{flex:1;min-width:0;cursor:pointer}
#chatHead .t b{display:block;font-size:1.05em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#chatHead .t small{color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#chatHead .t small.typ{color:var(--accent2)}
#back{display:none}
#chatSearch{display:flex;gap:8px;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line);align-items:center}
#chatSearch .field{margin:0;padding:9px 14px}
#msgs{flex:1;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:3px;overscroll-behavior:contain}
.more{align-self:center;color:var(--accent2);font-size:.85em;padding:6px 14px;background:var(--panel);border-radius:99px;margin-bottom:8px}
.day{align-self:center;color:var(--muted);font-size:.78em;background:var(--panel);padding:4px 12px;border-radius:99px;margin:10px 0}
.m{max-width:min(78%,560px);padding:7px 12px 6px;border-radius:19px;overflow-wrap:anywhere;position:relative;cursor:pointer}
.m.me{align-self:flex-end;background:var(--mine);color:#fff;border-bottom-right-radius:6px}
.m.th{align-self:flex-start;background:var(--theirs);border-bottom-left-radius:6px}
.m.pending{opacity:.65}
.m.del{opacity:.6;font-style:italic}
.m .who{font-size:.78em;color:var(--accent2);font-weight:700;margin-bottom:2px}
.m.me .who{color:#fff}
.m .txt{white-space:pre-wrap}
.m .txt a{color:inherit;text-decoration:underline}
.m .pic{display:block;max-width:100%;max-height:320px;border-radius:12px;margin:2px 0 3px;background:#0003;min-width:140px;min-height:90px;object-fit:cover;cursor:zoom-in}
.m audio{display:block;max-width:100%;height:38px;margin:2px 0}
.m .file{display:flex;gap:10px;align-items:center;padding:6px 0;cursor:pointer}
.m .file .fi{width:40px;height:40px;border-radius:12px;background:#fff2;display:grid;place-items:center;flex:none}
.m.th .file .fi{background:var(--panel2)}
.m .file b{display:block;font-weight:600;font-size:.92em;word-break:break-all}
.m .file small{opacity:.75}
.m .rp{border-left:3px solid var(--accent2);background:#0002;border-radius:8px;padding:4px 8px;margin-bottom:4px;font-size:.85em;cursor:pointer}
.m.me .rp{border-color:#fff;background:#fff2}
.m .rp b{display:block;font-size:.9em}
.m .rp span{opacity:.8;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m .meta{display:flex;gap:6px;justify-content:flex-end;align-items:center;font-size:.72em;opacity:.8;margin-top:1px}
.m .tick.read{color:#7dd3fc;opacity:1}
.m.th .tick{display:none}
.rxs{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}
.rx{background:#0003;border-radius:99px;padding:1px 8px;font-size:.85em;border:1px solid transparent}
.rx.mine{border-color:var(--accent2);background:color-mix(in srgb,var(--accent) 30%,transparent)}
#toBottom{position:absolute;right:14px;bottom:86px;width:44px;height:44px;border-radius:50%;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center;z-index:3;box-shadow:0 4px 18px #0006}
#toBottom .badge{position:absolute;top:-8px;right:-4px}
#bar{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--panel);border-top:1px solid var(--line)}
#bar .bi{color:var(--accent2)}
#bar .bt{flex:1;min-width:0;border-left:3px solid var(--accent2);padding-left:10px}
#bar .bt b{display:block;font-size:.85em;color:var(--accent2)}
#bar .bt span{display:block;font-size:.88em;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#emojiPanel{display:grid;grid-template-columns:repeat(8,1fr);gap:2px;padding:8px;background:var(--panel);border-top:1px solid var(--line);max-height:190px;overflow-y:auto}
#emojiPanel button{font-size:1.5em;padding:4px;border-radius:10px}
#emojiPanel button:hover{background:var(--panel2)}
#composer{display:flex;gap:6px;padding:10px 10px calc(10px + env(safe-area-inset-bottom));background:var(--panel);border-top:1px solid var(--line);align-items:flex-end}
#bar + #composer,#emojiPanel + #composer{border-top:0}
#text{flex:1;resize:none;max-height:140px;background:var(--field);border:1px solid transparent;border-radius:22px;padding:11px 16px;outline:none}
#text:focus{border-color:var(--accent)}
.rb{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--mine));color:#fff;display:grid;place-items:center;flex:none}
#recbar{display:flex;align-items:center;gap:12px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:var(--panel);border-top:1px solid var(--line)}
#recbar .rd{width:12px;height:12px;border-radius:50%;background:var(--danger);animation:bl 1s infinite}
@keyframes bl{50%{opacity:.25}}
#recbar .tm{flex:1;font-variant-numeric:tabular-nums}

/* ---------- modal / sheet / lightbox ---------- */
#modal,#sheet,#lightbox{position:fixed;inset:0;background:#000b;z-index:30;display:flex}
#modal{align-items:center;justify-content:center;padding:18px}
#modal .card{max-height:92vh;overflow-y:auto}
#modal h2{margin-bottom:12px}
#sheet{align-items:flex-end;justify-content:center;z-index:35}
.sheetbox{width:100%;max-width:520px;background:var(--panel);border-radius:24px 24px 0 0;padding:10px 12px calc(14px + env(safe-area-inset-bottom));border:1px solid var(--line);border-bottom:0}
.sheetbox .grab{width:42px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 10px}
.sheetbox .si{display:flex;align-items:center;gap:14px;width:100%;padding:13px 10px;border-radius:14px;text-align:left}
.sheetbox .si:hover,.sheetbox .si:active{background:var(--panel2)}
.sheetbox .si.danger{color:var(--danger)}
.rxrow{display:flex;justify-content:space-around;padding:4px 0 10px;border-bottom:1px solid var(--line);margin-bottom:6px}
.rxbtn{font-size:1.7em;padding:4px 8px;border-radius:12px}
.rxbtn:hover{background:var(--panel2)}
#lightbox{align-items:center;justify-content:center;flex-direction:column;z-index:40;background:#000e}
#lightbox img{max-width:96vw;max-height:84vh;border-radius:8px}
#lightbox .lb{position:absolute;top:calc(10px + env(safe-area-inset-top));right:10px;display:flex;gap:6px}
#lightbox .lb a,#lightbox .lb button{width:44px;height:44px;border-radius:50%;background:#fff2;color:#fff;display:grid;place-items:center}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tab{flex:1;padding:11px;border-radius:14px;background:var(--panel2);color:var(--muted)}
.tab.on{background:var(--accent);color:#fff}
.found{display:flex;gap:12px;align-items:center;padding:8px;border-radius:14px;cursor:pointer}
.found:hover{background:var(--panel2)}
.found .xb{margin-left:auto;color:var(--danger);padding:6px}
.chip{display:inline-flex;gap:6px;align-items:center;background:var(--panel2);border-radius:99px;padding:5px 11px;margin:0 6px 6px 0;font-size:.85em;cursor:pointer}
.role{font-size:.72em;color:var(--accent2);margin-left:auto;padding-left:8px}
#toast{position:fixed;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);max-width:92%;background:var(--panel2);color:var(--text);border:1px solid var(--line);padding:10px 18px;border-radius:16px;z-index:60;font-size:.88em;box-shadow:0 8px 30px #0008}

@media (max-width:820px){
  #side{width:100%}
  #main{position:fixed;inset:0;transform:translateX(100%);transition:transform .22s;z-index:5;height:100vh;height:100dvh}
  #app.chat #main{transform:none}
  #back{display:grid}
  .m{max-width:86%}
}
</style>
</head>
<body>

<!-- ===== Авторизация ===== -->
<div id="auth" class="hidden">
  <form class="card" id="authForm">
    <div class="logo"><div class="mark" data-i="chat"></div><h1>Octofy</h1></div>
    <p class="sub" id="authSub">Войдите, чтобы начать общение</p>
    <input class="field hidden" id="aUser" placeholder="Имя пользователя (латиницей)" autocomplete="username" maxlength="24" autocapitalize="off">
    <input class="field" id="aEmail" type="email" placeholder="Email" autocomplete="email" required>
    <input class="field" id="aPass" type="password" placeholder="Пароль (мин. 6 символов)" autocomplete="current-password" required minlength="6">
    <div class="err" id="aErr"></div>
    <button class="btn" id="aBtn" type="submit">Войти</button>
    <button class="link" id="aSwitch" type="button">Нет аккаунта? Зарегистрироваться</button>
  </form>
</div>

<!-- ===== Приложение ===== -->
<div id="app" class="hidden">
  <aside id="side">
    <div class="top">
      <div class="logo"><div class="mark" data-i="chat"></div><h1>Octofy</h1></div>
      <div><button class="ib" id="newBtn" data-i="edit" title="Новый чат"></button></div>
    </div>

    <div class="views">
      <section class="view" id="v-chats">
        <h2>Сообщения</h2>
        <div class="sbox"><span data-i="search"></span><input class="field" id="search" placeholder="Поиск чатов и сообщений..."></div>
        <div class="chips" id="chips">
          <button class="chp on" data-f="all">Все</button>
          <button class="chp" data-f="unread">Непрочитанные</button>
          <button class="chp" data-f="fav">Избранное</button>
          <button class="chp" data-f="group">Группы</button>
        </div>
        <div class="scroll" id="list"></div>
      </section>

      <section class="view hidden" id="v-contacts">
        <h2>Контакты</h2>
        <div class="sbox"><span data-i="search"></span><input class="field" id="csearch" placeholder="Найти человека..."></div>
        <div class="scroll" id="clist"></div>
      </section>

      <section class="view hidden" id="v-profile">
        <h2>Профиль</h2>
        <div class="scroll pad" style="margin:0">
          <div class="av xl" id="pAv" style="cursor:pointer" title="Сменить фото"></div>
          <button class="link" id="pAvBtn" style="margin:-4px 0 12px">Сменить фото</button>
          <div class="panel">
            <div class="lbl">Имя</div>
            <input class="field" id="pName" maxlength="40">
            <div class="lbl">О себе</div>
            <textarea class="field" id="pBio" maxlength="160" placeholder="Пара слов о себе"></textarea>
            <div class="lbl">Имя пользователя</div>
            <div id="pUser" style="font-weight:600"></div>
            <div class="err" id="pErr" style="margin:10px 0 0"></div>
          </div>
          <button class="btn" id="pSave">Сохранить</button>
          <div class="panel" style="margin-top:14px">
            <div class="lbl">Новый пароль</div>
            <input class="field" id="pPass" type="password" placeholder="Минимум 6 символов" autocomplete="new-password">
            <button class="btn ghost" id="pPassBtn" style="margin-top:0">Сменить пароль</button>
            <div class="err" id="pPassErr" style="margin:10px 0 0"></div>
          </div>
          <button class="btn danger" id="outBtn">Выйти из аккаунта</button>
        </div>
      </section>

      <section class="view hidden" id="v-settings">
        <h2>Настройки</h2>
        <div class="scroll pad" style="margin:0" id="settingsBox"></div>
      </section>
    </div>

    <nav class="nav" id="nav">
      <button data-v="chats" class="on"><span data-i="chat"></span>Чаты</button>
      <button data-v="contacts"><span data-i="users"></span>Контакты</button>
      <button data-v="profile"><span data-i="user"></span>Профиль</button>
      <button data-v="settings"><span data-i="gear"></span>Настройки</button>
    </nav>
  </aside>

  <section id="main">
    <div id="placeholder">Выберите чат слева<br>или начните новый кнопкой в шапке</div>
    <div id="chatView" class="hidden" style="display:none">
      <div id="chatHead">
        <button class="ib" id="back" data-i="back"></button>
        <div class="av s" id="hAv" style="cursor:pointer"></div>
        <div class="t" id="hInfo"><b id="hName"></b><small id="hSub"></small></div>
        <button class="ib" id="hSearch" data-i="search" title="Поиск в чате"></button>
        <button class="ib" id="hMenu" data-i="info" title="О чате"></button>
      </div>
      <div id="chatSearch" class="hidden">
        <input class="field" id="chatQ" placeholder="Поиск в этом чате">
        <button class="ib" id="chatQx" data-i="x"></button>
      </div>
      <div id="msgs"></div>
      <button id="toBottom" class="hidden"><span data-i="down"></span><span class="badge hidden" id="tbBadge"></span></button>
      <div id="bar" class="hidden">
        <span class="bi" id="barI"></span>
        <div class="bt"><b id="barT"></b><span id="barS"></span></div>
        <button class="ib" id="barX" data-i="x"></button>
      </div>
      <div id="emojiPanel" class="hidden"></div>
      <form id="composer">
        <button class="ib" id="attachBtn" type="button" data-i="clip" title="Прикрепить"></button>
        <button class="ib" id="emojiBtn" type="button" data-i="smile" title="Эмодзи"></button>
        <textarea id="text" rows="1" placeholder="Сообщение" maxlength="4000"></textarea>
        <button class="rb hidden" id="sendBtn" type="submit" data-i="send" title="Отправить"></button>
        <button class="rb" id="micBtn" type="button" data-i="mic" title="Голосовое сообщение"></button>
      </form>
      <div id="recbar" class="hidden">
        <span class="rd"></span><span class="tm" id="recTime">0:00</span>
        <button class="ib" id="recCancel" type="button" data-i="trash" title="Отмена"></button>

const ico = n => '<svg class="i" viewBox="0 0 24 24">'+ICONS[n]+'</svg>';

/* ---------- настройки вида ---------- */
const P = {

const ACCENTS = { violet:["#8b5cf6","#a78bfa","#7c3aed"], blue:["#3b82f6","#60a5fa","#2563eb"], pink:["#ec4899","#f472b6","#db2777"], green:["#10b981","#34d399","#059669"] };

applyLook();

/* ---------- первый запуск: ввод ключей ---------- */
if(SUPABASE_URL.includes("YOUR-PROJECT")||SUPABASE_ANON_KEY.includes("YOUR-ANON")){
  document.body.innerHTML='<div style="min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px"><div class="card"><h1 style="margin-bottom:8px">Octofy</h1><p class="sub">Первый запуск. Вставьте данные из Supabase: Project Settings → API.</p><input class="field" id="cUrl" placeholder="Project URL (https://...supabase.co)" autocapitalize="off"><input class="field" id="cKey" placeholder="Ключ anon public" autocapitalize="off"><div class="err" id="cErr"></div><button class="btn" id="cGo">Сохранить и запустить</button></div></div>';
  $("cGo").onclick=()=>{
    const u=$("cUrl").value.trim().replace(/\/+$/,""), k=$("cKey").value.trim();
    if(!/^https:\/\/.+\.supabase\.co$/.test(u)||k.length<20){ $("cErr").textContent="Проверьте URL и ключ"; return; }
    try{ localStorage.setItem("oct_url",u); localStorage.setItem("oct_key",k); }catch(e){}
    location.reload();
  };

}
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const AVATAR_PREFIX = SUPABASE_URL + "/storage/v1/object/public/avatars/";
const PAGE = 50, MAX_FILE = 25*1024*1024;

/* ---------- состояние ---------- */
let me=null, convs=[], profiles={}, lastMsg={}, unread={}, current=null, channel=null, filter="all";
let msgs=[], reactions={}, replyCache={}, hasMore=true, replyTo=null, editing=null, chatSearch="";
let online=new Set(), presenceCh=null, typingCh=null, typingUsers={}, lastTypingSent=0, seenTimer=null;
let lastDayKey=null, pendingMore=false, newWhileUp=0, msgHits=[], hitSeq=0;

/* ---------- утилиты ---------- */
const COLORS=["#8b5cf6","#0d9488","#c04f9a","#d97706","#059669","#dc2626","#2563eb","#9333ea"];
const colorFor=s=>COLORS[[...String(s)].reduce((a,c)=>a+c.charCodeAt(0),0)%COLORS.length];
const nameOf=p=>p?(p.display_name||p.username):"Пользователь";
function setAv(node,p,fallbackName){
  node.textContent=""; node.style.background="";
  if(p&&p.avatar_url&&String(p.avatar_url).startsWith(AVATAR_PREFIX)){
    const im=new Image(); im.src=p.avatar_url; im.alt=""; node.appendChild(im); return;
  }
  const n=fallbackName||nameOf(p);
  node.textContent=n.trim().charAt(0).toUpperCase()||"?"; node.style.background=colorFor(n);
}
function avNode(p,cls,fallbackName){ const d=el("div","av "+(cls||"")); setAv(d,p,fallbackName); return d; }
function toast(t){ const e=$("toast"); e.textContent=t; e.classList.remove("hidden"); clearTimeout(toast.t); toast.t=setTimeout(()=>e.classList.add("hidden"),3200); }
const fmtTime=d=>new Date(d).toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"});
function fmtListTime(d){
  const x=new Date(d), n=new Date(), y=new Date(); y.setDate(n.getDate()-1);
  if(x.toDateString()===n.toDateString()) return fmtTime(d);
  if(x.toDateString()===y.toDateString()) return "Вчера";
  return x.toLocaleDateString("ru-RU",{day:"2-digit",month:"2-digit"});
}
const fmtDay=d=>new Date(d).toLocaleDateString("ru-RU",{day:"numeric",month:"long"});
function fmtSeen(d){
  if(!d) return "был(а) давно";
  const x=new Date(d), n=new Date(), y=new Date(); y.setDate(n.getDate()-1);
  if(x.toDateString()===n.toDateString()) return "был(а) сегодня в "+fmtTime(d);
  if(x.toDateString()===y.toDateString()) return "был(а) вчера в "+fmtTime(d);
  return "был(а) "+x.toLocaleDateString("ru-RU",{day:"2-digit",month:"2-digit"});
}
const fmtSize=b=>!b?"":b<1024?b+" Б":b<1048576?(b/1024).toFixed(0)+" КБ":(b/1048576).toFixed(1)+" МБ";
const fmtDur=s=>Math.floor(s/60)+":"+String(Math.floor(s%60)).padStart(2,"0");
const uid=()=>(window.crypto&&crypto.randomUUID)?crypto.randomUUID():(Date.now().toString(16)+Math.random().toString(16).slice(2));
const visible=()=>document.visibilityState!=="hidden";
function errText(e){
  const m=(e&&e.message)||String(e);
  const map=[[/user not found/i,"Пользователь не найден"],[/yourself/i,"Нельзя написать самому себе"],[/Invalid login/i,"Неверный email или пароль"],
    [/already registered/i,"Этот email уже зарегистрирован"],[/Email not confirmed/i,"Подтвердите email по письму"],[/only owner/i,"Это может делать только владелец группы"],
    [/Failed to fetch|NetworkError|Load failed/i,"Нет связи с сервером"],[/schema cache/i,"База ещё обновляется, попробуйте через минуту"],
    [/row-level security|permission denied/i,"Нет прав на это действие"],[/exceeded|too large|payload/i,"Файл слишком большой"]];
  for(const [re,t] of map) if(re.test(m)) return t;
  return m;
}
function linkify(parent,text){
  const re=/(https?:\/\/[^\s<>"']+)/g; let last=0, m;
  while((m=re.exec(text))){
    if(m.index>last) parent.appendChild(document.createTextNode(text.slice(last,m.index)));
    let url=m[0], tail=""; const t=url.match(/[.,!?;:)\]]+$/); if(t){ tail=t[0]; url=url.slice(0,-tail.length); }
    const a=el("a",null,url); a.href=url; a.target="_blank"; a.rel="noopener noreferrer"; parent.appendChild(a);
    if(tail) parent.appendChild(document.createTextNode(tail));
    last=m.index+m[0].length;
  }
  if(last<text.length) parent.appendChild(document.createTextNode(text.slice(last)));
}
function beep(){
  try{
    const a=new (window.AudioContext||window.webkitAudioContext)(), o=a.createOscillator(), g=a.createGain();
    o.type="sine"; o.frequency.value=880; g.gain.setValueAtTime(.12,a.currentTime); g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.25);
    o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime+.25);
  }catch(e){}
}

/* ---------- авторизация ---------- */
let signUpMode=false;
function setMode(up){
  signUpMode=up;
  $("aUser").classList.toggle("hidden",!up);
  $("aBtn").textContent=up?"Создать аккаунт":"Войти";
  $("aSwitch").textContent=up?"Уже есть аккаунт? Войти":"Нет аккаунта? Зарегистрироваться";
  $("authSub").textContent=up?"Создайте аккаунт за минуту":"Войдите, чтобы начать общение";
  $("aPass").autocomplete=up?"new-password":"current-password";
  $("aErr").textContent="";
}
$("aSwitch").onclick=()=>setMode(!signUpMode);
$("authForm").onsubmit=async e=>{
  e.preventDefault(); $("aErr").textContent=""; $("aErr").classList.remove("ok"); $("aBtn").disabled=true;
  const email=$("aEmail").value.trim(), password=$("aPass").value;
  try{
    if(signUpMode){
      const username=$("aUser").value.trim().toLowerCase();
      if(!/^[a-z0-9_]{3,24}$/.test(username)) throw new Error("Имя: 3–24 символа, a-z, 0-9, _");
      const {data,error}=await sb.auth.signUp({email,password,options:{data:{username,display_name:username}}});
      if(error) throw error;
      if(!data.session){ $("aErr").classList.add("ok"); $("aErr").textContent="Проверьте почту и подтвердите email, затем войдите."; setMode(false); }
    }else{
      const {error}=await sb.auth.signInWithPassword({email,password});
      if(error) throw error;
    }
  }catch(err){ $("aErr").textContent=errText(err); }
  $("aBtn").disabled=false;
};
$("outBtn").onclick=async()=>{ await sb.auth.signOut(); };
sb.auth.onAuthStateChange((ev,session)=>{ setTimeout(()=>{ if(session) boot(session.user); else showAuth(); },0); });
function showAuth(){ teardown(); $("app").classList.add("hidden"); $("auth").classList.remove("hidden"); }

/* ---------- запуск ---------- */
let booted=null;
async function boot(user){
  if(booted===user.id) return; booted=user.id;
  const {data,error}=await sb.from("profiles").select("*").eq("id",user.id).maybeSingle();
  if(error||!data){ toast("Профиль не найден. Выполнен ли octofy_v2.sql?"); booted=null; return; }
  me=data; profiles[me.id]=me;
  $("auth").classList.add("hidden"); $("app").classList.remove("hidden");
  fillProfile(); drawSettings(); setView("chats");
  await loadConversations();
  subscribe(); startPresence(); touchSeen();
  clearInterval(seenTimer); seenTimer=setInterval(()=>{ if(visible()) touchSeen(); },60000);
}
function teardown(){
  booted=null; me=null; convs=[]; current=null; lastMsg={}; unread={}; msgs=[]; reactions={};
  clearInterval(seenTimer);
  [channel,presenceCh,typingCh].forEach(c=>{ if(c) sb.removeChannel(c); }); channel=presenceCh=typingCh=null;
  $("list").innerHTML=""; $("msgs").innerHTML=""; closeChatNow();
}
const touchSeen=()=>{ sb.rpc("touch_seen").then(()=>{}); };
document.addEventListener("visibilitychange",()=>{
  if(!me||!visible()) return;
  touchSeen(); syncAfterResume();
});
window.addEventListener("online",()=>{ if(me) syncAfterResume(); });
async function syncAfterResume(){
  await loadConversations();
  if(current&&msgs.length){
    const last=msgs.filter(m=>!m.pending).slice(-1)[0];
    const q=sb.from("messages").select("*").eq("conversation_id",current.id).order("created_at",{ascending:true}).limit(100);
    const {data}=await (last?q.gt("created_at",last.created_at):q);
    const fresh=(data||[]).filter(m=>!msgs.some(x=>x.id===m.id));
    if(fresh.length){ await loadExtras(fresh); fresh.forEach(m=>{ msgs.push(m); appendMessage(m); }); scrollDown(); }
    markRead(current.id);
  }
}

/* ---------- присутствие и «печатает» ---------- */
function startPresence(){
  presenceCh=sb.channel("octofy-presence",{config:{presence:{key:me.id}}});
  presenceCh.on("presence",{event:"sync"},()=>{ online=new Set(Object.keys(presenceCh.presenceState())); drawStatus(); renderList(); })
    .subscribe(async st=>{ if(st==="SUBSCRIBED") await presenceCh.track({at:Date.now()}); });
}
function joinTyping(cid){
  leaveTyping();
  typingCh=sb.channel("typing-"+cid);
  typingCh.on("broadcast",{event:"typing"},({payload})=>{
    if(!payload||payload.uid===me.id||!current||current.id!==cid) return;
    typingUsers[payload.uid]=Date.now()+3500; drawStatus(); setTimeout(drawStatus,3700);
  }).subscribe();
}
function leaveTyping(){ if(typingCh){ sb.removeChannel(typingCh); typingCh=null; } typingUsers={}; }
function sendTyping(){
  const n=Date.now(); if(!typingCh||n-lastTypingSent<2000) return; lastTypingSent=n;
  try{ typingCh.send({type:"broadcast",event:"typing",payload:{uid:me.id}}); }catch(e){}
}

/* ---------- навигация ---------- */
function setView(v){
  ["chats","contacts","profile","settings"].forEach(k=>$("v-"+k).classList.toggle("hidden",k!==v));
  document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on",b.dataset.v===v));
  if(v==="contacts") loadContacts();
}
$("nav").addEventListener("click",e=>{ const b=e.target.closest("button[data-v]"); if(b) setView(b.dataset.v); });
$("chips").addEventListener("click",e=>{
  const b=e.target.closest(".chp"); if(!b) return;
  filter=b.dataset.f; document.querySelectorAll(".chp").forEach(x=>x.classList.toggle("on",x===b)); renderList();
});

/* ---------- беседы ---------- */
const myM=c=>c.conversation_members.find(m=>m.user_id===me.id)||{};
const otherId=c=>{ const o=c.conversation_members.find(m=>m.user_id!==me.id); return o&&o.user_id; };
function convProfile(c){ return c.type==="direct"?profiles[otherId(c)]:null; }
function convTitle(c){ if(c.type==="group") return c.title||"Группа"; const p=profiles[otherId(c)]; return p?nameOf(p):"Чат"; }
function setConvAv(node,c){ const p=convProfile(c); setAv(node,p,convTitle(c)); }
function previewText(m){
  if(!m) return "Нет сообщений";
  if(m.deleted_at) return "Сообщение удалено";
  const pre=m.sender_id===me.id?"Вы: ":"";
  if(m.kind==="image") return pre+"📷 Фото";
  if(m.kind==="voice") return pre+"🎤 Голосовое сообщение";
  if(m.kind==="file") return pre+"📎 "+(m.file_name||"Файл");
  return pre+(m.body||"");
}
async function loadConversations(){
  const {data,error}=await sb.from("conversations")
    .select("id,type,title,last_message_at,conversation_members(user_id,role,joined_at,last_read_at,is_favorite,is_pinned,is_muted)")
    .order("last_message_at",{ascending:false});
  if(error){ toast(errText(error)); return; }
  convs=data||[];
  const ids=new Set(); convs.forEach(c=>c.conversation_members.forEach(m=>ids.add(m.user_id)));
  const need=[...ids].filter(i=>!profiles[i]);
  if(need.length){ const {data:ps}=await sb.from("profiles").select("*").in("id",need); (ps||[]).forEach(p=>profiles[p.id]=p); }
  lastMsg={};
  if(convs.length){
    const {data:ms}=await sb.from("messages").select("id,conversation_id,kind,body,file_name,deleted_at,sender_id,created_at")
      .in("conversation_id",convs.map(c=>c.id)).order("created_at",{ascending:false}).limit(400);
    (ms||[]).forEach(m=>{ if(!lastMsg[m.conversation_id]) lastMsg[m.conversation_id]=m; });
  }
  unread={};
  const u=await sb.rpc("get_unread_counts");
  if(!u.error) (u.data||[]).forEach(r=>unread[r.conversation_id]=Number(r.cnt));
  if(current){
    const c=convs.find(x=>x.id===current.id);
    if(c){ current=c; unread[c.id]=0; fillHead(); drawStatus(); } else { closeChatNow(); }
  }
  renderList();
}
function renderList(){
  const q=$("search").value.trim().toLowerCase();
  const box=$("list"); box.innerHTML="";
  let items=convs.filter(c=>!q||convTitle(c).toLowerCase().includes(q));
  if(filter==="unread") items=items.filter(c=>unread[c.id]>0);
  if(filter==="fav") items=items.filter(c=>myM(c).is_favorite);
  if(filter==="group") items=items.filter(c=>c.type==="group");
  items.sort((a,b)=>(myM(b).is_pinned?1:0)-(myM(a).is_pinned?1:0)||new Date(b.last_message_at)-new Date(a.last_message_at));
  if(!items.length&&!msgHits.length){
    const d=el("div","empty");
    d.textContent=q?"Ничего не найдено":filter==="unread"?"Непрочитанных сообщений нет":filter==="fav"?"Откройте чат → значок ⓘ → «В избранное»":filter==="group"?"Групп пока нет. Создайте через ✎":"Пока нет чатов. Нажмите ✎ или выберите человека во вкладке «Контакты».";
    box.appendChild(d); return;
  }
  items.forEach(c=>{
    const mm=myM(c), row=el("div","row"+(current&&current.id===c.id?" act":""));
    const av=el("div","av"); setConvAv(av,c);

async function loadBitmap(file){
  if(window.createImageBitmap){ try{ return await createImageBitmap(file); }catch(e){} }
  return await new Promise((res,rej)=>{ const im=new Image(); im.onload=()=>res(im); im.onerror=rej; im.src=URL.createObjectURL(file); });
}
const toBlob=(cv,type,q)=>new Promise(r=>cv.toBlob(r,type,q));
async function squareImage(file,size){
  const b=await loadBitmap(file), w=b.width, h=b.height, s=Math.min(w,h);
  const cv=document.createElement("canvas"); cv.width=cv.height=size;
  cv.getContext("2d").drawImage(b,(w-s)/2,(h-s)/2,s,s,0,0,size,size);
  return toBlob(cv,"image/jpeg",.85);
}
async function compressImage(file){
  if(!/^image\/(jpeg|png|webp)$/.test(file.type)) return file;
  try{
    const b=await loadBitmap(file), k=Math.min(1,1600/Math.max(b.width,b.height));
    const cv=document.createElement("canvas"); cv.width=Math.round(b.width*k); cv.height=Math.round(b.height*k);
    cv.getContext("2d").drawImage(b,0,0,cv.width,cv.height);
    const out=await toBlob(cv,"image/jpeg",.82);
    return (out&&out.size<file.size)?out:file;
  }catch(e){ return file; }
}

/* ---------- подписанные ссылки на файлы ---------- */
const urlCache=new Map();
const cachedUrl=p=>{ const c=urlCache.get(p); return c&&c.exp>Date.now()+60000?c.url:null; };
async function signed(paths){
  const need=[...new Set(paths)].filter(p=>p&&!cachedUrl(p));
  if(!need.length) return;
  const {data}=await sb.storage.from("chat-files").createSignedUrls(need,3600);
  (data||[]).forEach(r=>{ if(r.signedUrl) urlCache.set(r.path,{url:r.signedUrl,exp:Date.now()+3600000}); });
}
function hydrate(root){
  const nodes=[...root.querySelectorAll("[data-path]")];
  const apply=()=>nodes.forEach(n=>{ const u=cachedUrl(n.dataset.path); if(u&&n.getAttribute("src")!==u) n.src=u; });
  apply();
  const missing=nodes.filter(n=>!cachedUrl(n.dataset.path)).map(n=>n.dataset.path);
  if(missing.length) signed(missing).then(apply);
}

async function sendText(){
  const body=ta.value.trim(); if(!body||!current) return;
  if(editing){
    const m=editing; ta.value=""; autoH(); hideBar();
    if(body===m.body) return;
    const {error}=await sb.rpc("edit_message",{mid:m.id,new_body:body});
    if(error){ toast("Не удалось изменить: "+errText(error)); return; }
    m.body=body; m.edited_at=new Date().toISOString(); replaceBubble(m);
    if(lastMsg[m.conversation_id]&&lastMsg[m.conversation_id].id===m.id){ lastMsg[m.conversation_id].body=body; renderList(); }
    return;
  }
  const cid=current.id, rt=replyTo?replyTo.id:null;
  const payload={conversation_id:cid,sender_id:me.id,kind:"text",body,reply_to:rt};
  ta.value=""; autoH(); hideBar();
  const tmp=Object.assign({id:"tmp"+uid(),created_at:new Date().toISOString(),pending:true},payload);
  msgs.push(tmp); appendMessage(tmp); scrollDown();
  const {data,error}=await sb.from("messages").insert(payload).select().single();
  if(error){
    msgs=msgs.filter(x=>x!==tmp); const b=bubbleEl(tmp.id); if(b) b.remove();
    if(current&&current.id===cid&&!ta.value){ ta.value=body; autoH(); updateSendBtn(); }
    toast("Не отправлено: "+errText(error)); return;
  }
  finishPending(tmp,data);
}
function finishPending(tmp,data){
  const old=bubbleEl(tmp.id);
  if(msgs.some(x=>x.id===data.id)){ msgs=msgs.filter(x=>x!==tmp); if(old) old.remove(); }
  else{ const i=msgs.indexOf(tmp); if(i>=0) msgs[i]=data; if(old){ const n=renderMsg(data); old.replaceWith(n); hydrate(n); } }
  lastMsg[data.conversation_id]=data;
  const c=convs.find(x=>x.id===data.conversation_id); if(c) c.last_message_at=data.created_at;
  renderList();
}
async function sendFiles(files,hint){
  for(const f of files){
    if(f.size>MAX_FILE){ toast(f.name+": больше 25 МБ"); continue; }
    let blob=f, kind="file", type=f.type||"application/octet-stream";
    if(hint==="image"&&/^image\//.test(type)){ kind="image"; blob=await compressImage(f); type=blob.type||type; }
    await uploadAndSend(blob,{kind,name:f.name,type,size:blob.size});
  }
}
function extOf(meta){
  let ext=(meta.name&&meta.name.includes("."))?meta.name.split(".").pop():"";
  if(!ext){ const t=(meta.type||"").split(";")[0]; ext=({"image/jpeg":"jpg","image/png":"png","image/webp":"webp","image/gif":"gif","audio/webm":"webm","audio/mp4":"m4a","audio/ogg":"ogg"})[t]||"bin"; }
  return ext.replace(/[^a-zA-Z0-9]/g,"").slice(0,8)||"bin";
}
async function uploadAndSend(blob,meta){
  if(!current) return; const cid=current.id;
  const path=cid+"/"+uid()+"."+extOf(meta), rt=replyTo?replyTo.id:null; hideBar();
  const tmp={id:"tmp"+uid(),conversation_id:cid,sender_id:me.id,kind:meta.kind,body:null,file_name:meta.name,file_size:meta.size,duration:meta.duration||null,reply_to:rt,created_at:new Date().toISOString(),pending:true,_local:URL.createObjectURL(blob)};
  msgs.push(tmp); appendMessage(tmp); scrollDown();
  const fail=err=>{ msgs=msgs.filter(x=>x!==tmp); const b=bubbleEl(tmp.id); if(b) b.remove(); toast("Не отправлено: "+errText(err)); };
  const up=await sb.storage.from("chat-files").upload(path,blob,{contentType:(meta.type||"application/octet-stream").split(";")[0]});
  if(up.error){ fail(up.error); return; }
  const {data,error}=await sb.from("messages").insert({conversation_id:cid,sender_id:me.id,kind:meta.kind,file_path:path,file_name:meta.name,file_size:meta.size,file_type:(meta.type||"").split(";")[0],duration:meta.duration||null,reply_to:rt}).select().single();
  if(error){ fail(error); return; }
  finishPending(tmp,data);
}

let rec=null, recChunks=[], recStart=0, recTimer=null, recStream=null, recMime="";
$("micBtn").onclick=async()=>{
  if(!window.MediaRecorder||!navigator.mediaDevices){ toast("Запись голоса не поддерживается"); return; }
  try{ recStream=await navigator.mediaDevices.getUserMedia({audio:true}); }
  catch(e){ toast("Нет доступа к микрофону. Разрешите его в настройках приложения."); return; }
  recMime=["audio/webm;codecs=opus","audio/webm","audio/mp4","audio/ogg"].find(t=>MediaRecorder.isTypeSupported(t))||"";
  recChunks=[];
  rec=recMime?new MediaRecorder(recStream,{mimeType:recMime}):new MediaRecorder(recStream);
  rec.ondataavailable=e=>{ if(e.data&&e.data.size) recChunks.push(e.data); };
  rec.start(); recStart=Date.now();
  $("composer").classList.add("hidden"); $("recbar").classList.remove("hidden"); $("recTime").textContent="0:00";
  recTimer=setInterval(()=>{ $("recTime").textContent=fmtDur((Date.now()-recStart)/1000); },250);
};
function stopRec(send){
  if(!rec) return; const r=rec, dur=Math.round((Date.now()-recStart)/1000), mime=recMime||r.mimeType||"audio/webm";
  rec=null; clearInterval(recTimer);
  r.onstop=()=>{
    if(recStream) recStream.getTracks().forEach(t=>t.stop()); recStream=null;
    if(send&&dur>=1&&recChunks.length){ const blob=new Blob(recChunks,{type:mime}); uploadAndSend(blob,{kind:"voice",name:"voice."+extOf({type:mime}),type:mime,size:blob.size,duration:dur}); }
    else if(send) toast("Слишком короткое сообщение");
  };
  try{ r.stop(); }catch(e){}
  $("recbar").classList.add("hidden"); $("composer").classList.remove("hidden");
}

function subscribe(){
  if(channel) sb.removeChannel(channel);
  channel=sb.channel("octofy-"+me.id)
    .on("postgres_changes",{event:"INSERT",schema:"public",table:"messages"},p=>onMsgInsert(p.new))
    .on("postgres_changes",{event:"UPDATE",schema:"public",table:"messages"},p=>onMsgUpdate(p.new))
    .on("postgres_changes",{event:"INSERT",schema:"public",table:"message_reactions"},p=>onReaction(p.new,true))
    .on("postgres_changes",{event:"DELETE",schema:"public",table:"message_reactions"},p=>onReaction(p.old,false))
    .on("postgres_changes",{event:"INSERT",schema:"public",table:"conversation_members",filter:"user_id=eq."+me.id},()=>loadConversations())
    .on("postgres_changes",{event:"UPDATE",schema:"public",table:"conversation_members"},p=>onMemberUpdate(p.new))
    .on("postgres_changes",{event:"DELETE",schema:"public",table:"conversation_members"},()=>loadConversations())
    .on("postgres_changes",{event:"UPDATE",schema:"public",table:"conversations"},p=>onConvUpdate(p.new))
    .subscribe();
}
function notifyIncoming(c,m){
  if(myM(c).is_muted) return;
  const p=profiles[m.sender_id], title=c.type==="group"?convTitle(c)+": "+nameOf(p):nameOf(p), body=previewText(m).replace(/^Вы: /,"");
  if(P.get("notify",true)){
    toast(title+" — "+body.slice(0,60));
    if(document.hidden&&"Notification" in window&&Notification.permission==="granted"){ try{ new Notification(title,{body:body.slice(0,120),icon:"icon.svg",tag:c.id}); }catch(e){} }
  }
  if(P.get("sound",false)) beep();
}
async function onMsgInsert(m){
  const mine=m.sender_id===me.id;
  let c=convs.find(x=>x.id===m.conversation_id);
  if(!c){ await loadConversations(); c=convs.find(x=>x.id===m.conversation_id); if(!c) return; }
  lastMsg[m.conversation_id]=m; c.last_message_at=m.created_at;
  if(!profiles[m.sender_id]){ const {data}=await sb.from("profiles").select("*").eq("id",m.sender_id).maybeSingle(); if(data) profiles[data.id]=data; }
  const open=current&&current.id===m.conversation_id;
  if(open){
    if(!msgs.some(x=>x.id===m.id)){
      if(m.reply_to) await loadExtras([m]);
      const box=$("msgs"), near=box.scrollHeight-box.scrollTop-box.clientHeight<200;
      msgs.push(m); appendMessage(m);
      if(near||mine) scrollDown(); else{ newWhileUp++; drawToBottom(); }
    }
    if(!mine){ if(visible()) markRead(m.conversation_id); else{ unread[m.conversation_id]=(unread[m.conversation_id]||0)+1; notifyIncoming(c,m); } }
  }else if(!mine){ unread[m.conversation_id]=(unread[m.conversation_id]||0)+1; notifyIncoming(c,m); }
  renderList();
}
function onMsgUpdate(m){
  const lm=lastMsg[m.conversation_id]; if(lm&&lm.id===m.id){ Object.assign(lm,m); renderList(); }
  if(!current||current.id!==m.conversation_id) return;
  const i=msgs.findIndex(x=>x.id===m.id); if(i<0) return;
  msgs[i]=Object.assign(msgs[i],m); replaceBubble(msgs[i]);
}
function onReaction(r,add){
  if(!current||!r) return;
  if(add) addReaction(r); else removeReaction(r);
  const m=msgs.find(x=>x.id===r.message_id); if(m) replaceBubble(m);
}
function onMemberUpdate(r){
  const c=convs.find(x=>x.id===r.conversation_id); if(!c) return;
  const mm=c.conversation_members.find(x=>x.user_id===r.user_id); if(mm) Object.assign(mm,r);
  if(r.user_id!==me.id&&current&&current.id===c.id) refreshTicks();
  if(r.user_id===me.id) renderList();

function onConvUpdate(r){
  const c=convs.find(x=>x.id===r.id); if(!c) return;
  Object.assign(c,{title:r.title,last_message_at:r.last_message_at}); renderList(); if(current&&current.id===c.id) fillHead();

      if(!picked.size){ err.textContent="Добавьте хотя бы одного участника"; return; }
      go.disabled=true;
      const {data,error}=await sb.rpc("create_group_conversation",{group_title:title.value.trim(),usernames:[...picked.values()].map(p=>p.username)});
      go.disabled=false; if(error){ err.textContent=errText(error); return; }
      closeModal(); setView("chats"); await loadConversations(); openChat(data);
    };
    card.appendChild(go);
  }
  const cancel=el("button","link","Отмена"); cancel.type="button"; cancel.onclick=closeModal; card.appendChild(cancel);
  modal.appendChild(card); q.focus();
}

/* ---------- старт ---------- */
(async()=>{
  const {data:{session}}=await sb.auth.getSession();
  if(session) boot(session.user); else showAuth();
  if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
})();
</script>
